# SPDX-License-Identifier: Apache-2.0
# Unit tests: the Python plugin/bridge suite (pytest) and the add-in executors (node --test).
# No secrets, no network in the tests. Actions are pinned to full commit SHAs (tag in the comment).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out this plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The profile-isolation, port-release and session-marker tests import Hermes itself
      # (hermes_constants, plugins.plugin_storage, gateway.session_context); without it they skip.
      - name: Check out Hermes Agent v0.23.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # tag v0.23.0
          path: _hermes-agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install test dependencies (pinned)
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruamel.yaml==0.18.17 PyYAML==6.0.3 cryptography==50.0.2

      - name: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/_hermes-agent
        run: python -m pytest -q -c tests/pytest.ini tests -rs

      - name: node --test
        run: node --test tests/js/*.mjs
