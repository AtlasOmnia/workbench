# SPDX-License-Identifier: Apache-2.0
name: hermes-office-desktop
version: 0.3.0
manifest_version: 2
author: Atlas Omnia
license: Apache-2.0
description: >-
  Workbench by Atlas Omnia — works with Excel, Word, PowerPoint, OneNote and Outlook (mail and calendar) on the web. Free plugin: your notes remember the decision, Hermes turns it into the work. Chat in Hermes
  Desktop while the live OneNote, Excel, Word or PowerPoint for the web document in the Desktop
  preview pane changes as Hermes works. OneNote pages feed a local index (links, backlinks,
  cited answers, decisions) that becomes an Excel tracker, a Word brief and a short deck. A free
  bridge add-in (Upload My Add-in) runs Office.js; no Microsoft app registration, Graph or OAuth.
requires_hermes: ">=0.22.5"
platforms: [macos, windows]  # Windows: one real Hermes Desktop session passed the 5-prompt story on 2026-11-10 with a single profile.
tags: [office, onenote, excel, word, powerpoint, desktop, preview, second-brain]
provides_tools:
