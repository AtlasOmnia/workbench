  - excel_read_range
  - excel_summarize_range_stats
  - excel_write_range
  - excel_format_range
  - excel_conditional_format_range
  - excel_freeze_panes
  - excel_set_data_validation
  - excel_create_sheet
  - excel_delete_sheet
  - excel_activate_sheet
  - excel_insert_table
  - excel_sort_table
  - excel_filter_table
  - excel_create_chart
  - excel_find_replace
  - excel_clear_range
  - excel_autofill_formula
  - excel_rename_sheet
  - excel_copy_sheet
  - excel_protect_sheet
  - excel_unprotect_sheet
  - excel_create_pivot_table
  - excel_run_calculation
  - excel_add_comment
  - excel_clear_comments
  - excel_import_csv_to_sheet
  - word_get_document_overview
  - word_read_selection
  - word_read_document_text
  - word_apply_edit_plan
  - word_insert_text
  - word_replace_selection
  - word_find_replace
  - word_format_selection
  - word_get_document_structure
  - word_apply_style
  - word_insert_ooxml
  - word_insert_comment
  - powerpoint_get_presentation_overview
  - powerpoint_read_selected_slides
  - powerpoint_read_all_slides
  - powerpoint_create_slide
  - powerpoint_create_text_slide
  - powerpoint_add_text_box
  - powerpoint_update_slide_text
