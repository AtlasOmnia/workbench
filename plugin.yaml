provides_hooks:
  - pre_tool_call
config_schema:
  addin_base:
    type: str
    default: "https://atlasomnia.github.io/workbench/office/live/"
    label: "Add-in site"
    description: "Base URL of the add-in site (https, ending in /). The manifests, task panes and support page come from here, and the bridge accepts requests only from its origin (scheme and host)."
  allowed_origin:
    type: str
    default: ""
    label: "Add-in origin (self-hosting)"
    description: "Older form for a self-hosted site: an https origin alone means its add-in site is <origin>/office/live/. Ignored when addin_base is set to another site; if both are set they must agree."
  manifest_dir:
    type: str
    default: ""
    label: "Add-in manifest folder"
    description: "Absolute folder (~ allowed) where office_connect writes the five add-in manifests for allowed_origin. Empty: ~/Documents/Omnia Works/add-in manifests. A manifest you edited is never overwritten."
  image_dirs:
    type: list
    default: []
    label: "Extra image folders"
    description: "Absolute folders office_insert_image may read PNG/JPEG files from, in addition to this profile's Hermes image cache (generated images, images, screenshots). Symlinks are resolved; '/' and your home folder itself are ignored."
