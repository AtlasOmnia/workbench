  - powerpoint_add_image
  - onenote_get_context
  - onenote_list_sections
  - onenote_list_pages
  - onenote_get_page
  - onenote_create_page
  - onenote_append
  - onenote_insert_table
  - onenote_open_page
  - brain_sync
  - brain_ask
  - brain_links
  - brain_link_both_ways
  - brain_decision_page
